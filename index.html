<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital School Pocket</title>
    <!-- Konfigurasi PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f766e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel untuk JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        // --- KONFIGURASI SUPABASE ---
        const SUPABASE_URL = 'https://edltmcrgajlqlkmgpnss.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVkbHRtY3JnYWpscWxrbWdwbnNzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2NTA2MzEsImV4cCI6MjEwMDIyNjYzMX0.6JW2PFhxMLK0OBiJ9tSiZvy-CdUzrprTopNSZvNBs14'; 
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function DigitalSchoolPocket() {
            const [activeRole, setActiveRole] = React.useState('parent');
            const [adminTab, setAdminTab] = React.useState('students');
            const [selectedClassFilter, setSelectedClassFilter] = React.useState('Semua');
            const [searchKeyword, setSearchKeyword] = React.useState(''); 
            
            const [txSearchKeyword, setTxSearchKeyword] = React.useState('');
            const [txClassFilter, setTxClassFilter] = React.useState('Semua');
            
            const [students, setStudents] = React.useState([]);
            const [transactions, setTransactions] = React.useState([]);
            const [loading, setLoading] = React.useState(true);

            const [inputName, setInputName] = React.useState('');
            const [inputClass, setInputClass] = React.useState('Kelas 1');
            const [inputNisn, setInputNisn] = React.useState('');
            const [inputPin, setInputPin] = React.useState(''); 
            
            const [modalStudent, setModalStudent] = React.useState(null);
            const [modalType, setModalType] = React.useState('Setor');
            const [modalAmount, setModalAmount] = React.useState('');

            const [editModalStudent, setEditModalStudent] = React.useState(null);
            const [editNisn, setEditNisn] = React.useState('');
            const [editName, setEditName] = React.useState('');
            const [editClass, setEditClass] = React.useState('');
            const [editPin, setEditPin] = React.useState('');

            const [showBulkModal, setShowBulkModal] = React.useState(false);
            const [bulkText, setBulkText] = React.useState('');

            const [parentNisnInput, setParentNisnInput] = React.useState('');
            const [parentPinInput, setParentPinInput] = React.useState('');
            const [searchedStudent, setSearchedStudent] = React.useState(null);
            const [hasSearched, setHasSearched] = React.useState(false);

            const [isLicensed, setIsLicensed] = React.useState(() => {
                return localStorage.getItem('dsp_is_licensed') === 'true';
            });
            const [schoolName, setSchoolName] = React.useState(() => {
                return localStorage.getItem('dsp_school_name') || 'Demo Sekolah';
            });
            const [showLicenseModal, setShowLicenseModal] = React.useState(false);
            const [licenseKeyInput, setLicenseKeyInput] = React.useState('');

            const [adminPassword, setAdminPassword] = React.useState(() => {
                return localStorage.getItem('dsp_admin_pwd') || 'guru123';
            });
            const [showPasswordModal, setShowPasswordModal] = React.useState(false);
            const [inputPassword, setInputPassword] = React.useState('');
            const [showChangePwdModal, setShowChangePwdModal] = React.useState(false);
            const [oldPwd, setOldPwd] = React.useState('');
            const [newPwd, setNewPwd] = React.useState('');

            React.useEffect(() => {
                fetchDataFromCloud();
            }, []);

            React.useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            });

            const generateRandomPin = () => {
                const randomNum = Math.floor(100000 + Math.random() * 900000); 
                return String(randomNum);
            };

            const handleAcakInputPin = () => setInputPin(generateRandomPin());
            const handleAcakEditPin = () => setEditPin(generateRandomPin());

            const fetchDataFromCloud = async () => {
                setLoading(true);
                try {
                    const { data: studentData, error: studentError } = await supabase.from('students').select('*');
                    if (studentError) console.error('Gagal ambil data siswa:', studentError.message);
                    else if (studentData) setStudents(studentData);

                    const { data: txData, error: txError } = await supabase.from('transactions').select('*');
                    if (txError) console.error('Gagal ambil transaksi:', txError.message);
                    else if (txData) setTransactions(txData);
                } catch (err) {
                    console.error('Koneksi database gagal:', err);
                } finally {
                    setLoading(false);
                }
            };

            const handleActivateLicense = async (e) => {
                e.preventDefault();
                const cleanKey = licenseKeyInput.trim();
                if (!cleanKey) {
                    alert('Masukkan kunci lisensi terlebih dahulu!');
                    return;
                }

                try {
                    const { data, error } = await supabase
                        .from('licenses')
                        .select('*')
                        .ilike('license_key', cleanKey);

                    if (error || !data || data.length === 0) {
                        alert('Kunci lisensi tidak terdaftar di server!');
                        return;
                    }

                    const school = data[0];
                    setIsLicensed(true);
                    setSchoolName(school.school_name);
                    localStorage.setItem('dsp_is_licensed', 'true');
                    localStorage.setItem('dsp_school_name', school.school_name);
                    setShowLicenseModal(false);
                    setLicenseKeyInput('');
                    alert(`Lisensi aktif untuk sekolah: ${school.school_name}`);
                } catch (err) {
                    console.error(err);
                    alert('Terjadi kesalahan saat cek lisensi.');
                }
            };

            const handleLoginAdmin = (e) => {
                e.preventDefault();
                if (inputPassword === adminPassword) {
                    setActiveRole('admin');
                    setShowPasswordModal(false);
                    setInputPassword('');
                } else {
                    alert('Kata sandi guru salah!');
                }
            };

            const handleChangePassword = (e) => {
                e.preventDefault();
                if (oldPwd !== adminPassword) {
                    alert('Kata sandi lama salah!');
                    return;
                }
                if (!newPwd || newPwd.length < 3) {
                    alert('Kata sandi baru minimal 3 karakter!');
                    return;
                }
                setAdminPassword(newPwd);
                localStorage.setItem('dsp_admin_pwd', newPwd);
                alert('Kata sandi berhasil diubah!');
                setShowChangePwdModal(false);
                setOldPwd('');
                setNewPwd('');
            };

            const handleAddStudent = async (e) => {
                e.preventDefault();
                if (!inputName || !inputClass || !inputNisn || !inputPin) {
                    alert('Semua kolom harus diisi!');
                    return;
                }
                if (students.some(s => s.nisn === inputNisn)) {
                    alert('NISN sudah terdaftar!');
                    return;
                }
                const newStudent = { 
                    nisn: inputNisn, 
                    name: inputName, 
                    className: inputClass, 
                    balance: 0,
                    pin: inputPin 
                };
                
                const { error } = await supabase.from('students').insert([newStudent]);
                if (error) {
                    alert('Gagal menyimpan: ' + error.message);
                    return;
                }

                setStudents([newStudent, ...students]);
                setInputName('');
                setInputNisn('');
                setInputPin('');
                alert('Siswa berhasil ditambahkan!');
            };

            const handleBulkAddSubmit = async (e) => {
                e.preventDefault();
                if (!bulkText.trim()) {
                    alert('Data masih kosong!');
                    return;
                }

                const lines = bulkText.trim().split('\n');
                const newStudentsList = [];
                let duplicateCount = 0;

                for (let line of lines) {
                    const parts = line.split(/,|\t/).map(p => p.trim());
                    if (parts.length >= 3) {
                        const [nisn, name, className] = parts;
                        if (nisn && name && className) {
                            const exists = students.some(s => s.nisn === nisn) || newStudentsList.some(s => s.nisn === nisn);
                            if (!exists) {
                                newStudentsList.push({
                                    nisn: nisn,
                                    name: name,
                                    className: className,
                                    balance: 0,
                                    pin: generateRandomPin()
                                });
                            } else {
                                duplicateCount++;
                            }
                        }
                    }
                }

                if (newStudentsList.length === 0) {
                    alert('Tidak ada data valid yang bisa diproses.');
                    return;
                }

                const { error } = await supabase.from('students').insert(newStudentsList);
                if (error) {
                    alert('Gagal simpan masal ke server: ' + error.message);
                    return;
                }

                setStudents([...newStudentsList, ...students]);
                setShowBulkModal(false);
                setBulkText('');
                alert(`Berhasil menambahkan ${newStudentsList.length} siswa secara masal!`);
            };

            // --- FUNGSI EKSPOR CSV BERDASARKAN FILTER KELAS AKTIF ---
            const handleExportCSV = () => {
                const dataToExport = selectedClassFilter === 'Semua' 
                    ? students 
                    : students.filter(s => s.className === selectedClassFilter);

                if (dataToExport.length === 0) {
                    alert(`Tidak ada data siswa untuk ${selectedClassFilter === 'Semua' ? 'semua kelas' : selectedClassFilter}.`);
                    return;
                }

                let csvContent = "data:text/csv;charset=utf-8,NISN,Nama Siswa,Kelas,PIN Ortu,Saldo\n";
                dataToExport.forEach(s => {
                    csvContent += `"${s.nisn}","${s.name}","${s.className}","${s.pin || ''}",${s.balance}\n`;
                });

                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                
                const fileName = selectedClassFilter === 'Semua' 
                    ? "data_siswa_semua_kelas.csv" 
                    : `data_siswa_${selectedClassFilter.toLowerCase().replace(' ', '_')}.csv`;
                
                link.setAttribute("download", fileName);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const openEditModal = (student) => {
                setEditModalStudent(student);
                setEditNisn(student.nisn);
                setEditName(student.name);
                setEditClass(student.className);
                setEditPin(student.pin || '');
            };

            const handleSaveEditStudent = async (e) => {
                e.preventDefault();
                if (!editModalStudent) return;

                const { error } = await supabase
                    .from('students')
                    .update({ nisn: editNisn, name: editName, className: editClass, pin: editPin })
                    .eq('nisn', editModalStudent.nisn);

                if (error) {
                    alert('Gagal memperbarui data: ' + error.message);
                    return;
                }

                setStudents(students.map(s => s.nisn === editModalStudent.nisn ? { ...s, nisn: editNisn, name: editName, className: editClass, pin: editPin } : s));
                setEditModalStudent(null);
                alert('Data siswa berhasil diperbarui!');
            };

            const handleDeleteStudent = async (nisn) => {
                if (confirm('Yakin ingin menghapus siswa ini?')) {
                    const { error } = await supabase.from('students').delete().eq('nisn', nisn);
                    if (error) {
                        alert('Gagal menghapus: ' + error.message);
                        return;
                    }
                    setStudents(students.filter(s => s.nisn !== nisn));
                }
            };

            const handleDeleteTransaction = async (tx) => {
                if (!confirm(`Yakin ingin menghapus riwayat transaksi ${tx.type} sebesar Rp ${Number(tx.amount).toLocaleString('id-ID')} untuk ${tx.name}?`)) {
                    return;
                }

                // Cek apakah siswa masih ada di database/state saat ini
                const targetStudent = students.find(s => s.nisn === tx.nisn);

                // Jika siswa masih ada, sesuaikan kembali saldonya
                if (targetStudent) {
                    const adjustedBalance = tx.type === 'Setor' 
                        ? targetStudent.balance - tx.amount 
                        : targetStudent.balance + tx.amount;

                    if (adjustedBalance < 0) {
                        alert('Penghapusan transaksi gagal karena akan membuat saldo siswa menjadi minus.');
                        return;
                    }

                    const { error: updateError } = await supabase
                        .from('students')
                        .update({ balance: adjustedBalance })
                        .eq('nisn', tx.nisn);

                    if (updateError) {
                        alert('Gagal memperbarui saldo siswa: ' + updateError.message);
                        return;
                    }

                    setStudents(students.map(s => s.nisn === tx.nisn ? { ...s, balance: adjustedBalance } : s));
                }

                // Hapus riwayat transaksi dari database Supabase (tetap berjalan meskipun siswa sudah dihapus)
                const { error: deleteError } = await supabase
                    .from('transactions')
                    .delete()
                    .eq('id', tx.id);

                if (deleteError) {
                    alert('Gagal menghapus riwayat transaksi dari database: ' + deleteError.message);
                    return;
                }

                setTransactions(transactions.filter(t => t.id !== tx.id));
                alert('Riwayat transaksi berhasil dihapus.');
            };

            const handleExecuteTransaction = async (e) => {
                e.preventDefault();
                if (!modalStudent) return;
                const amountNum = Number(modalAmount);
                if (!amountNum || amountNum <= 0) {
                    alert('Masukkan jumlah uang yang benar!');
                    return;
                }
                if (modalType === 'Tarik' && modalStudent.balance < amountNum) {
                    alert('Saldo tidak cukup untuk penarikan ini!');
                    return;
                }

                const newBalance = modalType === 'Setor' ? modalStudent.balance + amountNum : modalStudent.balance - amountNum;

                const { error: updateError } = await supabase
                    .from('students')
                    .update({ balance: newBalance })
                    .eq('nisn', modalStudent.nisn);

                if (updateError) {
                    alert('Gagal update saldo: ' + updateError.message);
                    return;
                }

                const now = new Date();
                const dateStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
                
                const newTx = {
                    id: Date.now(), 
                    date: dateStr,
                    nisn: modalStudent.nisn,
                    name: modalStudent.name,
                    type: modalType,
                    amount: amountNum
                };

                const { error: txError } = await supabase.from('transactions').insert([newTx]);
                if (txError) {
                    alert('Gagal simpan riwayat: ' + txError.message);
                    return;
                }

                setStudents(students.map(s => s.nisn === modalStudent.nisn ? { ...s, balance: newBalance } : s));
                setTransactions([newTx, ...transactions]);
                setModalStudent(null);
                setModalAmount('');
                alert(`Berhasil ${modalType} Rp ${amountNum.toLocaleString('id-ID')}!`);
            };

            const handleParentSearch = (e) => {
                e.preventDefault();
                setHasSearched(true);
                const found = students.find(s => s.nisn === parentNisnInput.trim() && s.pin === parentPinInput.trim());
                setSearchedStudent(found || null);
            };

            const filteredStudents = students.filter(s => {
                const matchClass = selectedClassFilter === 'Semua' || s.className === selectedClassFilter;
                const matchSearch = s.name.toLowerCase().includes(searchKeyword.toLowerCase()) || s.nisn.includes(searchKeyword);
                return matchClass && matchSearch;
            });

            const filteredTransactions = transactions.filter(t => {
                const studentObj = students.find(s => s.nisn === t.nisn);
                const studentClass = studentObj ? studentObj.className : '';

                const matchClass = txClassFilter === 'Semua' || studentClass === txClassFilter;
                const matchName = t.name.toLowerCase().includes(txSearchKeyword.toLowerCase());
                const matchNisn = t.nisn.includes(txSearchKeyword);
                return matchClass && (matchName || matchNisn);
            });

            const getClassTxStats = (className) => {
                const classStudentsNisns = className === 'Semua' 
                    ? students.map(s => s.nisn) 
                    : students.filter(s => s.className === className).map(s => s.nisn);
                
                const classTxs = transactions.filter(t => classStudentsNisns.includes(t.nisn));
                const count = classTxs.length;
                const totalNominal = classTxs.reduce((acc, t) => {
                    return t.type === 'Setor' ? acc + t.amount : acc - t.amount;
                }, 0);
                return { count, totalNominal };
            };

            const monthlySummary = transactions.reduce((acc, tx) => {
                if (!tx.date) return acc;
                const monthYear = tx.date.substring(0, 7);
                if (!acc[monthYear]) {
                    acc[monthYear] = { setor: 0, tarik: 0 };
                }
                if (tx.type === 'Setor') {
                    acc[monthYear].setor += tx.amount;
                } else {
                    acc[monthYear].tarik += tx.amount;
                }
                return acc;
            }, {});

            if (loading) {
                return (
                    <div className="flex justify-center items-center min-h-screen text-teal-700 font-semibold">
                        Memuat data dari database...
                    </div>
                );
            }

            return (
                <div className="w-full max-w-7xl mx-auto p-4 sm:p-6 md:p-8">
                    {/* HEADER */}
                    <div className="bg-teal-700 text-white p-6 rounded-2xl shadow-lg mb-6 flex flex-col sm:flex-row justify-between items-center gap-4">
                        <div>
                            <h1 className="text-2xl font-bold flex items-center gap-2">
                                <i data-lucide="wallet" className="w-8 h-8"></i> Digital School Pocket
                            </h1>
                            <p className="text-teal-100 text-sm mt-1">
                                {activeRole === 'admin' ? 'Panel Utama Guru / Admin' : 'Portal Orang Tua (Cek Tabungan Anak)'} 
                                <span className="ml-2 bg-teal-800 text-teal-200 px-2.5 py-0.5 rounded-full text-xs font-semibold border border-teal-600">
                                    Lisensi: {isLicensed ? schoolName : 'Demo'}
                                </span>
                            </p>
                        </div>
                        <div className="flex items-center gap-2 flex-wrap justify-center">
                            {!isLicensed && (
                                <button 
                                    onClick={() => setShowLicenseModal(true)}
                                    className="bg-amber-500 hover:bg-amber-600 text-white px-3 py-2 rounded-xl text-xs font-bold shadow transition-all flex items-center gap-1">
                                    <i data-lucide="key" className="w-4 h-4"></i> Aktivasi Lisensi
                                </button>
                            )}
                            {activeRole === 'admin' ? (
                                <div className="flex gap-2">
                                    <button 
                                        onClick={() => {
                                            if ('serviceWorker' in navigator) {
                                                navigator.serviceWorker.getRegistrations().then((registrations) => {
                                                    for(let registration of registrations) {
                                                        registration.unregister();
                                                    }
                                                    window.location.reload(true);
                                                });
                                            } else {
                                                window.location.reload(true);
                                            }
                                        }}
                                        className="bg-sky-600 hover:bg-sky-700 text-white px-3 py-2 rounded-xl text-xs font-semibold shadow transition-all">
                                        Perbarui Aplikasi
                                    </button>
                                    <button 
                                        onClick={() => setShowChangePwdModal(true)}
                                        className="bg-teal-800 hover:bg-teal-900 text-teal-100 px-3 py-2 rounded-xl text-xs font-medium border border-teal-600 transition-all">
                                        Ganti Sandi
                                    </button>
                                    <button 
                                        onClick={() => setActiveRole('parent')}
                                        className="bg-teal-800 hover:bg-teal-900 text-teal-100 px-4 py-2 rounded-xl text-sm font-medium border border-teal-600 transition-all flex items-center gap-1.5">
                                        <i data-lucide="log-out" className="w-4 h-4"></i> Keluar Admin
                                    </button>
                                </div>
                            ) : (
                                <button 
                                    onClick={() => setShowPasswordModal(true)}
                                    className="bg-teal-800 hover:bg-teal-900 text-teal-100 px-4 py-2 rounded-xl text-sm font-medium border border-teal-600 transition-all flex items-center gap-1.5">
                                    <i data-lucide="shield-check" className="w-4 h-4"></i> Login Guru
                                </button>
                            )}
                        </div>
                    </div>

                    {/* DASHBOARD ADMIN */}
                    {activeRole === 'admin' && (
                        <div className="space-y-6">
                            <div className="flex border-b border-slate-200 gap-4 overflow-x-auto">
                                <button 
                                    onClick={() => setAdminTab('students')}
                                    className={`pb-3 font-semibold text-sm transition-colors border-b-2 whitespace-nowrap ${adminTab === 'students' ? 'border-teal-600 text-teal-700' : 'border-transparent text-slate-500 hover:text-slate-800'}`}>
                                    Data Kelas
                                </button>
                                <button 
                                    onClick={() => setAdminTab('transactions')}
                                    className={`pb-3 font-semibold text-sm transition-colors border-b-2 whitespace-nowrap ${adminTab === 'transactions' ? 'border-teal-600 text-teal-700' : 'border-transparent text-slate-500 hover:text-slate-800'}`}>
                                    Riwayat Transaksi
                                </button>
                                <button 
                                    onClick={() => setAdminTab('monthly')}
                                    className={`pb-3 font-semibold text-sm transition-colors border-b-2 whitespace-nowrap ${adminTab === 'monthly' ? 'border-teal-600 text-teal-700' : 'border-transparent text-slate-500 hover:text-slate-800'}`}>
                                    Rekap Bulanan
                                </button>
                            </div>

                            {/* TAB 1: DATA KELAS */}
                            {adminTab === 'students' && (
                                <div className="space-y-6">
                                    <div>
                                        <h2 className="text-sm font-bold text-slate-700 mb-3 flex items-center gap-1.5">
                                            <i data-lucide="folder" className="w-4 h-4 text-teal-600"></i> Rekap per Kelas
                                        </h2>
                                        <div className="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 gap-3">
                                            {['Semua', 'Kelas 1', 'Kelas 2', 'Kelas 3', 'Kelas 4', 'Kelas 5', 'Kelas 6'].map(className => {
                                                const count = className === 'Semua' ? students.length : students.filter(s => s.className === className).length;
                                                const totalBalance = className === 'Semua' 
                                                    ? students.reduce((acc, s) => acc + s.balance, 0)
                                                    : students.filter(s => s.className === className).reduce((acc, s) => acc + s.balance, 0);
                                                const isSelected = selectedClassFilter === className;

                                                return (
                                                    <div 
                                                        key={className}
                                                        onClick={() => setSelectedClassFilter(className)}
                                                        className={`p-4 rounded-xl border cursor-pointer transition-all ${isSelected ? 'bg-teal-50/60 border-teal-500 shadow-sm ring-1 ring-teal-500' : 'bg-white border-slate-200 hover:border-slate-300'}`}>
                                                        <p className="text-xs font-semibold text-slate-500 flex items-center gap-1">
                                                            <i data-lucide="users" className="w-3.5 h-3.5"></i> {className}
                                                        </p>
                                                        <h3 className="text-lg font-bold text-slate-800 mt-1">{count} <span className="text-xs font-normal text-slate-500">siswa</span></h3>
                                                        <p className="text-xs font-bold text-emerald-600 mt-0.5">Rp {totalBalance.toLocaleString('id-ID')}</p>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>

                                    <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                                        <div className="flex justify-between items-center mb-4 flex-wrap gap-2">

                                            type="button" 
                                            onClick={() => { setShowLicenseModal(false); setLicenseKeyInput(''); }}
                                            className="bg-slate-100 hover:bg-slate-200 text-slate-600 px-4 py-2 rounded-lg text-sm font-medium transition-colors">
                                            Batal
                                        </button>
                                        <button 
                                            type="submit" 
                                            className="bg-teal-600 hover:bg-teal-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">
                                            Aktifkan
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL PASSWORD GURU */}
                    {showPasswordModal && (
                        <div className="fixed inset-0 bg-slate-900/50 flex justify-center items-center p-4 z-50">
                            <div className="bg-white p-6 rounded-2xl shadow-xl max-w-sm w-full">
                                <h3 className="text-lg font-bold mb-1 text-slate-800">Login Guru / Admin</h3>
                                <form onSubmit={handleLoginAdmin} className="space-y-4">
                                    <input 
                                        type="password" 
                                        placeholder="Kata Sandi (Default: guru123)"
                                        value={inputPassword}
                                        onChange={(e) => setInputPassword(e.target.value)}
                                        className="w-full border border-slate-200 px-3 py-2 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-teal-500"
                                        autoFocus
                                    />
                                    <div className="flex gap-2 justify-end">
                                        <button 
                                            type="button" 
                                            onClick={() => { setShowPasswordModal(false); setInputPassword(''); }}
                                            className="bg-slate-100 hover:bg-slate-200 text-slate-600 px-4 py-2 rounded-lg text-sm font-medium transition-colors">
                                            Batal
                                        </button>
                                        <button 
                                            type="submit" 
                                            className="bg-teal-600 hover:bg-teal-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">
                                            Masuk
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL GANTI SANDI GURU */}
                    {showChangePwdModal && (
                        <div className="fixed inset-0 bg-slate-900/50 flex justify-center items-center p-4 z-50">
                            <div className="bg-white p-6 rounded-2xl shadow-xl max-w-sm w-full">
                                <h3 className="text-lg font-bold mb-1 text-slate-800">Ganti Sandi Guru</h3>
                                <form onSubmit={handleChangePassword} className="space-y-3">
                                    <div>
                                        <label className="block text-xs font-medium text-slate-600 mb-1">Sandi Lama</label>
                                        <input 
                                            type="password" 
                                            value={oldPwd}
                                            onChange={(e) => setOldPwd(e.target.value)}
                                            className="w-full border border-slate-200 px-3 py-2 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-teal-500"
                                            autoFocus
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-medium text-slate-600 mb-1">Sandi Baru</label>
                                        <input 
                                            type="password" 
                                            value={newPwd}
                                            onChange={(e) => setNewPwd(e.target.value)}
                                            className="w-full border border-slate-200 px-3 py-2 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-teal-500"
                                        />
                                    </div>
                                    <div className="flex gap-2 justify-end pt-2">
                                        <button 
                                            type="button" 
                                            onClick={() => { setShowChangePwdModal(false); setOldPwd(''); setNewPwd(''); }}
                                            className="bg-slate-100 hover:bg-slate-200 text-slate-600 px-4 py-2 rounded-lg text-sm font-medium transition-colors">
                                            Batal
                                        </button>
                                        <button 
                                            type="submit" 
                                            className="bg-teal-600 hover:bg-teal-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">
                                            Simpan
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL TRANSAKSI */}
                    {modalStudent && (
                        <div className="fixed inset-0 bg-slate-900/50 flex justify-center items-center p-4 z-50">
                            <div className="bg-white p-6 rounded-2xl shadow-xl max-w-sm w-full">
                                <h3 className="text-lg font-bold mb-1 text-slate-800">{modalType} Tunai</h3>
                                <p className="text-xs text-slate-500 mb-4">Siswa: <span className="font-semibold text-slate-700">{modalStudent.name}</span></p>
                                <form onSubmit={handleExecuteTransaction} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-medium text-slate-600 mb-1">Jumlah (Rp)</label>
                                        <input 
                                            type="number" 
                                            placeholder="Contoh: 10000"
                                            value={modalAmount}
                                            onChange={(e) => setModalAmount(e.target.value)}
                                            className="w-full border border-slate-200 px-3 py-2 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-teal-500"
                                            autoFocus
                                        />
                                    </div>
                                    <div className="flex gap-2 justify-end">
                                        <button 
                                            type="button" 
                                            onClick={() => setModalStudent(null)}
                                            className="bg-slate-100 hover:bg-slate-200 text-slate-600 px-4 py-2 rounded-lg text-sm font-medium transition-colors">
                                            Batal
                                        </button>
                                        <button 
                                            type="submit" 
                                            className={`px-4 py-2 rounded-lg text-sm font-medium text-white transition-colors ${modalType === 'Setor' ? 'bg-emerald-600 hover:bg-emerald-700' : 'bg-rose-600 hover:bg-rose-700'}`}>
                                            Konfirmasi
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<DigitalSchoolPocket />, document.getElementById('root'));
    </script>

    <!-- TAMBAHKAN DI SINI -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .then((reg) => console.log('Service Worker terdaftar:', reg.scope))
                    .catch((err) => console.log('Gagal daftar Service Worker:', err));
            });
        }
    </script>

</body>
</html>
