<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital School Pocket</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel untuk JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        function DigitalSchoolPocket() {
            const [activeRole, setActiveRole] = React.useState('admin');
            const [adminTab, setAdminTab] = React.useState('students'); // 'students', 'transactions', 'monthly'
            const [selectedClassFilter, setSelectedClassFilter] = React.useState('Semua');
            
            const [students, setStudents] = React.useState(() => {
                const saved = localStorage.getItem('dsp_students');
                return saved ? JSON.parse(saved) : [
                    { nisn: '0012345678', name: 'Andi Pratama', className: 'Kelas 6', balance: 150000 },
                    { nisn: '0012345679', name: 'Siti Nurhaliza', className: 'Kelas 6', balance: 85000 },
                    { nisn: '0012345680', name: 'Budi Santoso', className: 'Kelas 5', balance: 40000 },
                    { nisn: '0012345681', name: 'Dewi Lestari', className: 'Kelas 1', balance: 50000 }
                ];
            });

            const [transactions, setTransactions] = React.useState(() => {
                const saved = localStorage.getItem('dsp_transactions');
                return saved ? JSON.parse(saved) : [
                    { id: '1', date: '2026-07-21 10:30', nisn: '0012345678', name: 'Andi Pratama', type: 'Setor', amount: 50000 }
                ];
            });

            const [inputName, setInputName] = React.useState('');
            const [inputClass, setInputClass] = React.useState('Kelas 1');
            const [inputNisn, setInputNisn] = React.useState('');
            
            const [modalStudent, setModalStudent] = React.useState(null);
            const [modalType, setModalType] = React.useState('Setor');
            const [modalAmount, setModalAmount] = React.useState('');

            const [parentNisnInput, setParentNisnInput] = React.useState('');
            const [searchedStudent, setSearchedStudent] = React.useState(null);
            const [hasSearched, setHasSearched] = React.useState(false);

            React.useEffect(() => {
                localStorage.setItem('dsp_students', JSON.stringify(students));
            }, [students]);

            React.useEffect(() => {
                localStorage.setItem('dsp_transactions', JSON.stringify(transactions));
            }, [transactions]);

            React.useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            });

            const handleAddStudent = (e) => {
                e.preventDefault();
                if (!inputName || !inputClass || !inputNisn) {
                    alert('Semua kolom harus diisi!');
                    return;
                }
                if (students.some(s => s.nisn === inputNisn)) {
                    alert('NISN sudah terdaftar!');
                    return;
                }
                const newStudent = { nisn: inputNisn, name: inputName, className: inputClass, balance: 0 };
                setStudents([newStudent, ...students]);
                setInputName('');
                setInputNisn('');
                alert('Siswa berhasil ditambahkan!');
            };

            const handleDeleteStudent = (nisn) => {
                if (confirm('Apakah Anda yakin ingin menghapus data siswa ini?')) {
                    setStudents(students.filter(s => s.nisn !== nisn));
                }
            };

            const handleExecuteTransaction = (e) => {
                e.preventDefault();
                if (!modalStudent) return;
                const amountNum = Number(modalAmount);
                if (!amountNum || amountNum <= 0) {
                    alert('Masukkan nominal yang valid!');
                    return;
                }
                if (modalType === 'Tarik' && modalStudent.balance < amountNum) {
                    alert('Saldo tidak mencukupi untuk penarikan ini!');
                    return;
                }

                const updatedStudents = students.map(s => {
                    if (s.nisn === modalStudent.nisn) {
                        const newBalance = modalType === 'Setor' ? s.balance + amountNum : s.balance - amountNum;
                        return { ...s, balance: newBalance };
                    }
                    return s;
                });

                setStudents(updatedStudents);

                const now = new Date();
                const dateStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
                
                const newTx = {
                    id: Date.now().toString(),
                    date: dateStr,
                    nisn: modalStudent.nisn,
                    name: modalStudent.name,
                    type: modalType,
                    amount: amountNum
                };

                setTransactions([newTx, ...transactions]);
                setModalStudent(null);
                setModalAmount('');
                alert(`Berhasil melakukan ${modalType} Rp ${amountNum.toLocaleString('id-ID')}`);
            };

            const handleParentSearch = (e) => {
                e.preventDefault();
                setHasSearched(true);
                const found = students.find(s => s.nisn === parentNisnInput.trim());
                setSearchedStudent(found || null);
            };

            const totalSavings = students.reduce((acc, curr) => acc + curr.balance, 0);
            const totalStudentsCount = students.length;
            const todayStr = new Date().toISOString().split('T')[0];
            const todayTransactionsCount = transactions.filter(t => t.date.startsWith(todayStr)).length;

            // Filter Siswa Berdasarkan Kelas
            const filteredStudents = selectedClassFilter === 'Semua' 
                ? students 
                : students.filter(s => s.className === selectedClassFilter);

            // Hitung Rekap Bulanan dari Transaksi
            const monthlySummary = transactions.reduce((acc, tx) => {
                const monthYear = tx.date.substring(0, 7); // Format YYYY-MM
                if (!acc[monthYear]) {
                    acc[monthYear] = { setor: 0, tarik: 0 };
                }
                if (tx.type === 'Setor') {
                    acc[monthYear].setor += tx.amount;
                } else {
                    acc[monthYear].tarik += tx.amount;
                }
                return acc;
            }, {});

            return (
                <div className="max-w-4xl mx-auto p-4 sm:p-6">
                    {/* HEADER */}
                    <div className="bg-teal-700 text-white p-6 rounded-2xl shadow-lg mb-6 flex flex-col sm:flex-row justify-between items-center gap-4">
                        <div>
                            <h1 className="text-2xl font-bold flex items-center gap-2">
                                <i data-lucide="wallet" className="w-8 h-8"></i> Digital School Pocket
                            </h1>
                            <p className="text-teal-100 text-sm mt-1">Sistem Manajemen Tabungan Siswa Modern</p>
                        </div>
                        <div className="flex bg-teal-800 p-1 rounded-xl border border-teal-600">
                            <button 
                                onClick={() => setActiveRole('admin')}
                                className={`px-4 py-2 rounded-lg text-sm font-medium transition-all ${activeRole === 'admin' ? 'bg-white text-teal-800 shadow' : 'text-teal-100 hover:text-white'}`}>
                                <i data-lucide="shield-check" className="w-4 h-4 inline mr-1"></i> Guru / Admin
                            </button>
                            <button 
                                onClick={() => setActiveRole('parent')}
                                className={`px-4 py-2 rounded-lg text-sm font-medium transition-all ${activeRole === 'parent' ? 'bg-white text-teal-800 shadow' : 'text-teal-100 hover:text-white'}`}>
                                <i data-lucide="user-check" className="w-4 h-4 inline mr-1"></i> Orang Tua
                            </button>
                        </div>
                    </div>

                    {/* DASHBOARD ADMIN */}
                    {activeRole === 'admin' && (
                        <div className="space-y-6">
                            {/* KARTU STATISTIK */}
                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-100 flex items-center gap-4">
                                    <div className="p-3 bg-teal-50 text-teal-600 rounded-xl"><i data-lucide="users" className="w-6 h-6"></i></div>
                                    <div>
                                        <p className="text-xs text-slate-500 font-medium">Total Siswa</p>
                                        <h3 className="text-xl font-bold text-slate-800">{totalStudentsCount} Siswa</h3>
                                    </div>
                                </div>
                                <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-100 flex items-center gap-4">
                                    <div className="p-3 bg-emerald-50 text-emerald-600 rounded-xl"><i data-lucide="wallet" className="w-6 h-6"></i></div>
                                    <div>
                                        <p className="text-xs text-slate-500 font-medium">Total Tabungan</p>
                                        <h3 className="text-xl font-bold text-slate-800">Rp {totalSavings.toLocaleString('id-ID')}</h3>
                                    </div>
                                </div>
                                <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-100 flex items-center gap-4">
                                    <div className="p-3 bg-blue-50 text-blue-600 rounded-xl"><i data-lucide="arrow-left-right" className="w-6 h-6"></i></div>
                                    <div>
                                        <p className="text-xs text-slate-500 font-medium">Transaksi Hari Ini</p>
                                        <h3 className="text-xl font-bold text-slate-800">{todayTransactionsCount}</h3>
                                    </div>
                                </div>
                            </div>

                            {/* SUB TAB MENU ADMIN */}
                            <div className="flex border-b border-slate-200 gap-4 overflow-x-auto">
                                <button 
                                    onClick={() => setAdminTab('students')}
                                    className={`pb-3 font-semibold text-sm transition-colors border-b-2 whitespace-nowrap ${adminTab === 'students' ? 'border-teal-600 text-teal-700' : 'border-transparent text-slate-500 hover:text-slate-800'}`}>
                                    Data Siswa per Kelas
                                </button>
                                <button 
                                    onClick={() => setAdminTab('transactions')}
                                    className={`pb-3 font-semibold text-sm transition-colors border-b-2 whitespace-nowrap ${adminTab === 'transactions' ? 'border-teal-600 text-teal-700' : 'border-transparent text-slate-500 hover:text-slate-800'}`}>
                                    Riwayat Transaksi
                                </button>
                                <button 
                                    onClick={() => setAdminTab('monthly')}
                                    className={`pb-3 font-semibold text-sm transition-colors border-b-2 whitespace-nowrap ${adminTab === 'monthly' ? 'border-teal-600 text-teal-700' : 'border-transparent text-slate-500 hover:text-slate-800'}`}>
                                    Rekapitulasi Bulanan
                                </button>
                            </div>

                            {/* KONTEN TAB: DATA SISWA & KELAS */}
                            {adminTab === 'students' && (
                                <div className="space-y-6">
                                    {/* FORM TAMBAH SISWA */}
                                    <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                                        <h2 className="text-lg font-bold mb-4 flex items-center gap-2 text-slate-800">
                                            <i data-lucide="user-plus" className="w-5 h-5 text-teal-600"></i> Tambah Siswa Baru
                                        </h2>
                                        <form onSubmit={handleAddStudent} className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                            <input 
                                                type="text" 
                                                placeholder="NISN Siswa" 
                                                value={inputNisn} 
                                                onChange={(e) => setInputNisn(e.target.value)}
                                                className="border border-slate-200 px-3 py-2 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-teal-500"
                                            />
                                            <input 
                                                type="text" 
                                                placeholder="Nama Lengkap" 
                                                value={inputName} 
                                                onChange={(e) => setInputName(e.target.value)}
                                                className="border border-slate-200 px-3 py-2 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-teal-500"
                                            />
                                            <div className="flex gap-2">
                                                <select 
                                                    value={inputClass} 
                                                    onChange={(e) => setInputClass(e.target.value)}
                                                    className="border border-slate-200 px-3 py-2 rounded-lg text-sm flex-1 bg-white focus:outline-none focus:ring-2 focus:ring-teal-500">
                                                    <option value="Kelas 1">Kelas 1</option>
                                                    <option value="Kelas 2">Kelas 2</option>
                                                    <option value="Kelas 3">Kelas 3</option>
                                                    <option value="Kelas 4">Kelas 4</option>
                                                    <option value="Kelas 5">Kelas 5</option>
                                                    <option value="Kelas 6">Kelas 6</option>
                                                </select>
                                                <button type="submit" className="bg-teal-600 hover:bg-teal-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">
                                                    Simpan
                                                </button>
                                            </div>
                                        </form>
                                    </div>

                                    {/* TABEL DATA SISWA & FILTER KELAS */}
                                    <div className="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden">
                                        <div className="p-5 border-b border-slate-100 flex flex-col sm:flex-row justify-between items-center gap-3">
                                            <h2 className="text-lg font-bold text-slate-800">Daftar Tabungan Siswa</h2>
                                            <div className="flex items-center gap-2">
                                                <span className="text-xs text-slate-500 font-medium">Filter Kelas:</span>
                                                <select 
                                                    value={selectedClassFilter} 
                                                    onChange={(e) => setSelectedClassFilter(e.target.value)}
                                                    className="border border-slate-200 px-3 py-1.5 rounded-lg text-xs bg-white focus:outline-none focus:ring-2 focus:ring-teal-500 font-medium">
                                                    <option value="Semua">Semua Kelas</option>
                                                    <option value="Kelas 1">Kelas 1</option>
                                                    <option value="Kelas 2">Kelas 2</option>
                                                    <option value="Kelas 3">Kelas 3</option>
                                                    <option value="Kelas 4">Kelas 4</option>
                                                    <option value="Kelas 5">Kelas 5</option>
                                                    <option value="Kelas 6">Kelas 6</option>
                                                </select>
                                            </div>
                                        </div>
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-left border-collapse">
                                                <thead>
                                                    <tr className="bg-slate-50 text-slate-500 text-xs uppercase tracking-wider">
                                                        <th className="p-4">NISN</th>
                                                        <th className="p-4">Nama Siswa</th>
                                                        <th className="p-4">Kelas</th>
                                                        <th className="p-4">Saldo</th>
                                                        <th className="p-4 text-center">Aksi</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-100 text-sm">
                                                    {filteredStudents.length === 0 ? (
                                                        <tr>
                                                            <td colSpan="5" className="p-6 text-center text-slate-400">Tidak ada data siswa untuk kelas ini.</td>
                                                        </tr>
                                                    ) : (
                                                        filteredStudents.map((student) => (
                                                            <tr key={student.nisn} className="hover:bg-slate-50/50">
                                                                <td className="p-4 font-medium text-slate-600">{student.nisn}</td>
                                                                <td className="p-4 font-semibold text-slate-800">{student.name}</td>
                                                                <td className="p-4 text-slate-600">
                                                                    <span className="bg-slate-100 text-slate-700 px-2.5 py-1 rounded-md text-xs font-semibold">{student.className}</span>
                                                                </td>
                                                                <td className="p-4 font-bold text-emerald-600">Rp {student.balance.toLocaleString('id-ID')}</td>
                                                                <td className="p-4 text-center space-x-1">
                                                                    <button 
                                                                        onClick={() => { setModalStudent(student); setModalType('Setor'); }}
                                                                        className="bg-emerald-50 hover:bg-emerald-100 text-emerald-700 px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors">
                                                                        Setor
                                                                    </button>
                                                                    <button 
                                                                        onClick={() => { setModalStudent(student); setModalType('Tarik'); }}
                                                                        className="bg-rose-50 hover:bg-rose-100 text-rose-700 px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors">
                                                                        Tarik
                                                                    </button>
                                                                    <button 
                                                                        onClick={() => handleDeleteStudent(student.nisn)}
                                                                        className="bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors">
                                                                        Hapus
                                                                    </button>
                                                                </td>
                                                            </tr>
                                                        ))
                                                    )}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* KONTEN TAB: RIWAYAT TRANSAKSI */}
                            {adminTab === 'transactions' && (
                                <div className="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden">
                                    <div className="p-5 border-b border-slate-100 flex justify-between items-center">
                                        <h2 className="text-lg font-bold text-slate-800">Log Riwayat Transaksi Tabungan</h2>
                                    </div>
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left border-collapse">
                                            <thead>
                                                <tr className="bg-slate-50 text-slate-500 text-xs uppercase tracking-wider">
                                                    <th className="p-4">Waktu</th>
                                                    <th className="p-4">NISN</th>
                                                    <th className="p-4">Nama Siswa</th>
                                                    <th className="p-4">Jenis</th>
                                                    <th className="p-4">Nominal</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100 text-sm">
                                                {transactions.length === 0 ? (
                                                    <tr>
                                                        <td colSpan="5" className="p-6 text-center text-slate-400">Belum ada transaksi tercatat.</td>
                                                    </tr>
                                                ) : (
                                                    transactions.map((tx) => (
                                                        <tr key={tx.id} className="hover:bg-slate-50/50">
                                                            <td className="p-4 text-slate-500 text-xs">{tx.date}</td>
                                                            <td className="p-4 font-medium text-slate-600">{tx.nisn}</td>
                                                            <td className="p-4 font-semibold text-slate-800">{tx.name}</td>
                                                            <td className="p-4">
                                                                <span className={`px-2.5 py-1 rounded-md text-xs font-semibold ${tx.type === 'Setor' ? 'bg-emerald-50 text-emerald-700' : 'bg-rose-50 text-rose-700'}`}>
                                                                    {tx.type}
                                                                </span>
                                                            </td>
                                                            <td className={`p-4 font-bold ${tx.type === 'Setor' ? 'text-emerald-600' : 'text-rose-600'}`}>
                                                                {tx.type === 'Setor' ? '+' : '-'} Rp {tx.amount.toLocaleString('id-ID')}
                                                            </td>
                                                        </tr>
                                                    ))
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}

                            {/* KONTEN TAB: REKAPITULASI BULANAN */}
                            {adminTab === 'monthly' && (
                                <div className="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden">
                                    <div className="p-5 border-b border-slate-100">
                                        <h2 className="text-lg font-bold text-slate-800">Ringkasan Total Tabungan per Bulan</h2>
                                        <p className="text-xs text-slate-500 mt-1">Akumulasi total setoran dan penarikan berdasarkan periode bulan.</p>
                                    </div>
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left border-collapse">
                                            <thead>
                                                <tr className="bg-slate-50 text-slate-500 text-xs uppercase tracking-wider">
                                                    <th className="p-4">Bulan / Periode</th>
                                                    <th className="p-4">Total Setoran Masuk</th>
                                                    <th className="p-4">Total Penarikan Keluar</th>
                                                    <th className="p-4">Net / Selisih</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100 text-sm">
                                                {Object.keys(monthlySummary).length === 0 ? (
                                                    <tr>
                                                        <td colSpan="4" className="p-6 text-center text-slate-400">Belum ada data rekapitulasi bulanan.</td>
                                                    </tr>
                                                ) : (
                                                    Object.entries(monthlySummary).map(([month, data]) => {
                                                        const net = data.setor - data.tarik;
                                                        return (
                                                            <tr key={month} className="hover:bg-slate-50/50">
                                                                <td className="p-4 font-semibold text-slate-800">{month}</td>
                                                                <td className="p-4 font-bold text-emerald-600">+ Rp {data.setor.toLocaleString('id-ID')}</td>
                                                                <td className="p-4 font-bold text-rose-600">- Rp {data.tarik.toLocaleString('id-ID')}</td>
                                                                <td className={`p-4 font-bold ${net >= 0 ? 'text-teal-700' : 'text-rose-700'}`}>
                                                                    Rp {net.toLocaleString('id-ID')}
                                                                </td>
                                                            </tr>
                                                        );
                                                    })
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    {/* DASHBOARD ORANG TUA */}
                    {activeRole === 'parent' && (
                        <div className="space-y-6">
                            <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-100 text-center max-w-lg mx-auto">
                                <h2 className="text-lg font-bold text-slate-800 mb-2">Cek Saldo Siswa</h2>
                                <p className="text-xs text-slate-500 mb-4">Masukkan NISN anak Anda untuk melihat informasi saldo dan detail tabungan secara spesifik.</p>
                                <form onSubmit={handleParentSearch} className="flex gap-2">
                                    <input 
                                        type="text" 
                                        placeholder="Masukkan NISN Siswa..." 
                                        value={parentNisnInput}
                                        onChange={(e) => setParentNisnInput(e.target.value)}
                                        className="border border-slate-200 px-3 py-2 rounded-lg text-sm flex-1 focus:outline-none focus:ring-2 focus:ring-teal-500"
                                    />
                                    <button type="submit" className="bg-teal-600 hover:bg-teal-700 text-white px-5 py-2 rounded-lg text-sm font-medium transition-colors">
                                        Cari
                                    </button>
                                </form>
                            </div>

                            {hasSearched && searchedStudent && (
                                <div className="bg-white p-6 rounded-xl shadow-sm border border-teal-100 max-w-lg mx-auto bg-gradient-to-br from-teal-50/50 to-white space-y-4">
                                    <div className="flex justify-between items-start border-b border-teal-100 pb-4">
                                        <div>
                                            <span className="text-xs bg-teal-100 text-teal-800 font-semibold px-2.5 py-1 rounded-md">{searchedStudent.className}</span>
                                            <h3 className="text-xl font-bold text-slate-800 mt-2">{searchedStudent.name}</h3>
                                            <p className="text-xs text-slate-500">NISN: {searchedStudent.nisn}</p>
                                        </div>
                                        <div className="text-right">
                                            <p className="text-xs text-slate-500">Saldo Saat Ini</p>
                                            <p className="text-2xl font-bold text-emerald-600">Rp {searchedStudent.balance.toLocaleString('id-ID')}</p>
                                        </div>
                                    </div>
                                    <div>
                                        <h4 className="text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">Riwayat Transaksi Anak Ini</h4>
                                        <div className="max-h-48 overflow-y-auto space-y-2">
                                            {transactions.filter(t => t.nisn === searchedStudent.nisn).length === 0 ? (
                                                <p className="text-xs text-slate-400 text-center py-2">Belum ada transaksi untuk siswa ini.</p>
                                            ) : (
                                                transactions.filter(t => t.nisn === searchedStudent.nisn).map(t => (
                                                    <div key={t.id} className="flex justify-between items-center text-xs bg-white p-2.5 rounded-lg border border-slate-100">
                                                        <div>
                                                            <span className={`font-semibold ${t.type === 'Setor' ? 'text-emerald-600' : 'text-rose-600'}`}>{t.type}</span>
                                                            <span className="text-slate-400 ml-2">{t.date}</span>
                                                        </div>
                                                        <span className="font-bold text-slate-700">Rp {t.amount.toLocaleString('id-ID')}</span>
                                                    </div>
                                                ))
                                            )}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {hasSearched && !searchedStudent && (
                                <div className="bg-rose-50 text-rose-700 p-4 rounded-xl text-center text-sm font-medium max-w-lg mx-auto">
                                    Siswa dengan NISN tersebut tidak ditemukan. Silakan periksa kembali.
                                </div>
                            )}
                        </div>
                    )}

                    {/* MODAL TRANSAKSI */}
                    {modalStudent && (
                        <div className="fixed inset-0 bg-slate-900/50 flex justify-center items-center p-4 z-50">
                            <div className="bg-white p-6 rounded-2xl shadow-xl max-w-sm w-full">
                                <h3 className="text-lg font-bold mb-1 text-slate-800">{modalType} Tunai</h3>
                                <p className="text-xs text-slate-500 mb-4">Siswa: <span className="font-semibold text-slate-700">{modalStudent.name}</span></p>
                                <form onSubmit={handleExecuteTransaction} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-medium text-slate-600 mb-1">Nominal (Rp)</label>
                                        <input 
                                            type="number" 
                                            placeholder="Contoh: 10000"
                                            value={modalAmount}
                                            onChange={(e) => setModalAmount(e.target.value)}
                                            className="w-full border border-slate-200 px-3 py-2 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-teal-500"
                                            autoFocus
                                        />
                                    </div>
                                    <div className="flex gap-2 justify-end">
                                        <button 
                                            type="button" 
                                            onClick={() => setModalStudent(null)}
                                            className="bg-slate-100 hover:bg-slate-200 text-slate-600 px-4 py-2 rounded-lg text-sm font-medium transition-colors">
                                            Batal
                                        </button>
                                        <button 
                                            type="submit" 
                                            className={`px-4 py-2 rounded-lg text-sm font-medium text-white transition-colors ${modalType === 'Setor' ? 'bg-emerald-600 hover:bg-emerald-700' : 'bg-rose-600 hover:bg-rose-700'}`}>
                                            Konfirmasi
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<DigitalSchoolPocket />, document.getElementById('root'));
    </script>
</body>
</html>
